<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock AI Platform · Interactive Architecture</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121e30;--line:#293b54;--muted:#95a9c3;--text:#eaf2ff;--blue:#5cb7ff;--green:#53dab1;--orange:#ffbc70;--purple:#c4a0ff}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}header{padding:20px 26px 16px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:21px;margin:0 0 3px;font-weight:750}header p{margin:0;color:var(--muted)}.tag{display:inline-block;padding:4px 9px;border-radius:100px;border:1px solid #365271;color:#b9d8f5;font-size:11px;font-weight:700;letter-spacing:.08em}#toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 22px;border-bottom:1px solid var(--line);background:#0e1727}button,input{font:inherit}button{background:#18283e;border:1px solid #344a65;color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}button:hover{background:#263b57}button.active{border-color:var(--blue);background:#1b3855;color:#d9efff}input{width:240px;background:#142238;color:var(--text);border:1px solid #344a65;padding:9px 12px;border-radius:9px;outline:none}input:focus{border-color:var(--blue)}.spacer{flex:1}.layout{display:grid;grid-template-columns:minmax(0,1fr) 355px;height:calc(100vh - 139px);min-height:580px}.canvas-wrap{position:relative;overflow:hidden;background-color:#0b1423;background-image:radial-gradient(#233650 1px,transparent 1px);background-size:22px 22px;cursor:grab}.canvas-wrap:active{cursor:grabbing}svg{display:block;width:100%;height:100%;touch-action:none}.node{cursor:pointer}.node rect{stroke-width:1.6;transition:filter .15s,stroke-width .15s}.node:hover rect,.node.selected rect{stroke-width:3;filter:drop-shadow(0 0 9px #4077a855)}.node.dim{opacity:.15}.edge{fill:none;stroke:#57718e;stroke-width:2;opacity:.62;marker-end:url(#arrow)}.edge.highlight{stroke:#fcd279;stroke-width:3.2;opacity:1}.edge.dim{opacity:.07}.node-title{font-weight:700;fill:#f4f8ff;font-size:14px}.node-sub{font-size:11px;fill:#bed0e4}.phase-title{font-weight:800;font-size:22px;fill:#dbeeff}.phase-note{fill:#9eacc4;font-size:13px}.pane{background:#101d2d;border-left:1px solid var(--line);padding:22px;overflow:auto}#detail .eyebrow{color:#a6c2e3;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:11px}#detail h2{font-size:22px;line-height:1.2;margin:8px 0 9px}#detail p{color:#b8c7da}h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#94b5d7;margin:24px 0 9px}.pill{display:inline-block;border-radius:8px;padding:3px 9px;margin:3px 4px 3px 0;background:#1c3550;color:#d9ebff;font-size:12px}.item{padding:9px 0;border-bottom:1px solid #25364d;color:#d1deef}.muted{color:var(--muted)}.note{padding:12px;background:#1b2b41;border:1px solid #304862;border-radius:10px;font-size:12px;color:#d2e2f6}.legend{position:absolute;bottom:15px;left:16px;background:#111e2eec;border:1px solid #38516c;border-radius:10px;padding:10px 13px;display:flex;gap:15px;font-size:12px;pointer-events:none}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.small{font-size:12px}.kbd{background:#293b53;padding:2px 6px;border-radius:4px}#empty{color:#acc0d6}a{color:#96ceff}@media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}.canvas-wrap{height:580px}.pane{border-left:0;border-top:1px solid var(--line);min-height:340px}input{width:170px}}
</style></head><body>
<header><div><span class="tag">EW PORTFOLIO / SYSTEM DESIGN</span><h1>Stock AI Platform · Interactive Architecture</h1><p>Two distinct paths: live/on-demand delivery and research/ML processing. Click any component to inspect it.</p></div><div class="tag">AWS · Upstox · XGBoost</div></header>
<div id="toolbar"><button data-filter="all" class="active">All phases</button><button data-filter="serve">① Serving</button><button data-filter="pipeline">② Data & ML</button><input id="search" placeholder="Search nodes…" aria-label="Search nodes"><span class="spacer"></span><button id="minus" title="Zoom out">−</button><button id="plus" title="Zoom in">+</button><button id="reset">Fit diagram</button></div>
<div class="layout"><section class="canvas-wrap" id="viewport"><svg id="chart" viewBox="0 0 1560 1040" role="img" aria-label="Interactive architecture diagram with service nodes and data-flow arrows"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a93b0"/></marker></defs><g id="world"></g></svg><div class="legend"><span><i class="dot" style="background:#5cb7ff"></i>API / serving</span><span><i class="dot" style="background:#53dab1"></i>Storage</span><span><i class="dot" style="background:#ffbc70"></i>Jobs / compute</span><span><i class="dot" style="background:#c4a0ff"></i>ML / analytics</span></div></section><aside class="pane"><div id="detail"></div></aside></div>
<script>
const nodes=[
{id:'react',name:'React Dashboard',sub:'Watchlist · search · charts · forecasts',phase:'serve',type:'api',x:65,y:160,w:235,h:94,desc:'Authenticated user-facing application. Displays watchlisted live prices, stock search, quotes, historical candles, and AI predictions.',inputs:['JWT authentication','Live watchlist events','On-demand REST responses'],outputs:['API requests','Watchlist add/remove','AppSync channel subscriptions'],notes:'Do not embed the Upstox Analytics Token in the browser.'},
{id:'cognito',name:'Amazon Cognito',sub:'Login · JWT · user roles',phase:'serve',type:'api',x:360,y:50,w:230,h:78,desc:'Handles sign-in and issues JWTs for protected APIs and appropriate real-time authorization.',inputs:['User login'],outputs:['JWT access/ID tokens'],notes:'Apply backend authorization checks for watchlist ownership.'},
{id:'api',name:'API Gateway + Lambda',sub:'Backend orchestration and protected APIs',phase:'serve',type:'api',x:363,y:160,w:236,h:94,desc:'Validates user requests and calls Upstox REST endpoints, Aurora, caches, and prediction services as needed.',inputs:['Authenticated frontend requests'],outputs:['Quotes, details, charts, predictions, watchlist changes'],notes:'Keep all third-party API credentials server-side. Add throttling and safe error handling.'},
{id:'upstoxrest',name:'Upstox REST APIs',sub:'Batch LTP · quotes · OHLCV · metadata',phase:'serve',type:'api',x:659,y:156,w:232,h:100,desc:'Source of on-demand market data for non-watchlisted stocks and watchlist snapshots when streaming is off.',inputs:['Requests from Lambda with secure credentials'],outputs:['Batch quotes, stock details, historical candles'],notes:'Batch according to the documented endpoint limits; implement quotas, retries and request caching. The instrument master may be sourced from the downloadable file.'},
{id:'fargate',name:'ECS Fargate Stream',sub:'One shared Upstox WebSocket client',phase:'serve',type:'compute',x:958,y:152,w:239,h:106,desc:'During market hours, runs a shared Upstox WebSocket client and subscribes to the union of required watchlist instruments.',inputs:['Watchlist instrument set','Upstox WebSocket ticks','Start/stop schedule'],outputs:['Normalized price events sent to AppSync'],notes:'Dynamic watchlist changes need a subscription-control mechanism. Respect provider subscription limits and data rights.'},
{id:'upstoxws',name:'Upstox WebSocket',sub:'Live LTP feed (market session)',phase:'serve',type:'api',x:1286,y:155,w:222,h:96,desc:'Upstox Market Data Feed V3; supplies live subscribed instrument updates using the upstream protocol.',inputs:['Authorized subscription request'],outputs:['Live market updates'],notes:'Market hours and actual feed availability vary on holidays and special sessions.'},
{id:'appsync',name:'AWS AppSync Events',sub:'Fan-out to authorized subscribers',phase:'serve',type:'api',x:1108,y:336,w:280,h:90,desc:'Distributes streaming price batches from Fargate to connected frontend users; event access should be restricted appropriately.',inputs:['Published normalized stock updates'],outputs:['Live updates to subscribers'],notes:'Avoid broadcasting licensed prices to unauthorized audiences. Channel/filter design must support user isolation.'},
{id:'aurora',name:'Aurora PostgreSQL',sub:'Operational state · persisted results',phase:'shared',type:'storage',x:348,y:342,w:246,h:110,desc:'Transactional source for user profiles, watchlists, predictions, prediction outcomes, model metadata, and optionally searchable news references.',inputs:['Watchlist changes','Prediction outputs and outcomes','Model registry metadata'],outputs:['Watchlist instrument keys','Predictions and past results'],notes:'Do not write every market tick to Aurora just to power the user interface.'},
{id:'cache',name:'Optional Shared Cache',sub:'Short-lived quotes · symbol lookup',phase:'shared',type:'storage',x:702,y:346,w:257,h:105,desc:'Optional Redis/ElastiCache or simpler equivalent for market-quote TTLs, symbol lookup, and dynamic watchlist subscription state.',inputs:['Quote responses','Instrument metadata','Watchlist changes'],outputs:['Fast reads and subscription deltas'],notes:'Redis is not mandatory for the first iteration. S3 can persist instrument snapshots, while Lambda memory can provide basic per-instance caching.'},
{id:'scheduler',name:'EventBridge Scheduler',sub:'Market-aware start/stop + daily sync',phase:'shared',type:'compute',x:1050,y:50,w:278,h:78,desc:'Runs scheduled tasks such as instrument-master refresh, Fargate start, and Fargate shutdown. ML jobs use a separate cadence.',inputs:['IST schedules','NSE holiday and session calendar'],outputs:['ECS start/stop','Lambda data ingestion events'],notes:'Typical schedule: 08:00 sync, 09:00 start, 15:35 stop IST. Validate trading holidays, special sessions, and time zone settings.'},
{id:'collect',name:'Collection Jobs',sub:'Lambda · scheduled external data',phase:'pipeline',type:'compute',x:66,y:605,w:220,h:94,desc:'Fetches instrument master and historical OHLCV, together with news and macroeconomic data for the AI research pipeline.',inputs:['Upstox historical API/master file','News APIs','Macro data sources'],outputs:['Raw dated datasets'],notes:'Use incremental and backfill jobs, rate limits, and clear data rights. Live watchlist streaming is separate.'},
{id:'raw',name:'S3 Raw Data Lake',sub:'Versioned source datasets',phase:'pipeline',type:'storage',x:359,y:603,w:230,h:98,desc:'Stores permitted historical candles, instrument snapshots, source news metadata, and macro timeseries in dated versions.',inputs:['Collected source datasets'],outputs:['Raw datasets for feature engineering'],notes:'Prefer Parquet for large tabular history; JSON/CSV may suit the instrument master. Retain provenance and timestamps.'},
{id:'glue',name:'AWS Glue ETL',sub:'Cleaning · features · normalization',phase:'pipeline',type:'ml',x:661,y:601,w:245,h:103,desc:'Cleans raw data, adjusts historical prices where appropriate, aligns trading sessions and macro inputs, and builds technical and news features.',inputs:['S3 raw datasets'],outputs:['Processed/feature datasets'],notes:'Use reproducible transformations and avoid future-data leakage into training features.'},
{id:'processed',name:'S3 Processed Data',sub:'Feature sets · train/test splits',phase:'pipeline',type:'storage',x:980,y:604,w:224,h:98,desc:'Stores training-ready features, split information and versioned evaluation datasets.',inputs:['Glue feature outputs'],outputs:['Versioned datasets for training and backtests'],notes:'Keep training and evaluation partitions time-aware; track preprocessing versions.'},
{id:'train',name:'XGBoost Training',sub:'4 targets · walk-forward evaluation',phase:'pipeline',type:'ml',x:1264,y:588,w:238,h:128,desc:'Trains separate models for forecast closing price, highest price, lowest price, and probability of a positive return over the defined window.',inputs:['Training and backtest datasets'],outputs:['Candidate trained models','Performance metrics','Forecasts from inference'],notes:'Model quality must be assessed against naïve baselines with out-of-sample, walk-forward tests. Classification probabilities should be calibrated.'},
{id:'artifact',name:'S3 Model Artifacts',sub:'Model versions · evaluation reports',phase:'pipeline',type:'storage',x:1255,y:800,w:247,h:95,desc:'Stores fitted XGBoost artifacts, performance reports, model configuration, and reproducibility metadata.',inputs:['Validated training outputs'],outputs:['Models loaded for batch or on-demand prediction'],notes:'Keep traceable links between model version, dataset version, and published forecasts.'},
{id:'inference',name:'Prediction + Risk Engine',sub:'Batch inference · ranking · no-trade',phase:'pipeline',type:'ml',x:760,y:795,w:332,h:103,desc:'Runs trained models to generate forecasts, probabilities and risk/opportunity assessments, then persists results for the dashboard.',inputs:['S3 model artifacts','Recent market features'],outputs:['Forecasts to Aurora','Risk/opportunity scores','No-trade indications'],notes:'Training and inference are distinct jobs; do not retrain on each frontend request.'},
{id:'athena',name:'Glue Catalog + Athena',sub:'Optional query/validation layer',phase:'pipeline',type:'ml',x:374,y:795,w:294,h:103,desc:'Catalogs S3 datasets and supports SQL-based analysis, data checks, and research.',inputs:['S3 raw and processed datasets'],outputs:['Ad-hoc analysis and quality checks'],notes:'Helpful for research, but not required for initial dashboard serving.'},
{id:'mlschedule',name:'ML / Data Scheduler',sub:'Ingestion and retraining cadence',phase:'pipeline',type:'compute',x:74,y:800,w:211,h:98,desc:'Runs daily data backfills and periodic model training or batch inference after data is ready.',inputs:['EventBridge schedules','Data readiness'],outputs:['Collect/train/inference job triggers'],notes:'Avoid retraining solely because the market closes. Define a measured cadence based on model drift and compute cost.'}
];
const edges=[['react','api'],['react','cognito'],['api','upstoxrest'],['api','aurora'],['api','cache'],['scheduler','fargate'],['fargate','upstoxws'],['fargate','appsync'],['appsync','react'],['aurora','fargate'],['cache','fargate'],['scheduler','collect'],['collect','raw'],['raw','glue'],['glue','processed'],['processed','train'],['train','artifact'],['artifact','inference'],['inference','aurora'],['raw','athena'],['processed','athena'],['mlschedule','collect'],['mlschedule','train'],['mlschedule','inference']];
const palette={api:['#133352','#59b6ff'],compute:['#42301f','#ffb566'],storage:['#153c36','#55deb3'],ml:['#332749','#c6a5ff']};
const NS='http://www.w3.org/2000/svg',byId=Object.fromEntries(nodes.map(n=>[n.id,n]));let selected=null,filter='all',search='',zoom=1,px=0,py=0;const world=document.getElementById('world'),svg=document.getElementById('chart');
function el(name,attrs={},parent=world){const e=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}function textNode(x,y,s,cls,parent){const e=el('text',{x,y,class:cls},parent);e.textContent=s;return e}
function path(a,b){let x1=a.x+a.w/2,y1=a.y+a.h/2,x2=b.x+b.w/2,y2=b.y+b.h/2;const dx=x2-x1,dy=y2-y1;let p;if(Math.abs(dx)>Math.abs(dy)*.7){const sx=dx>0?a.x+a.w:a.x,tx=dx>0?b.x:b.x,sy=y1,ty=y2;p=`M${sx} ${sy} C${sx+(tx-sx)*.52} ${sy},${sx+(tx-sx)*.48} ${ty},${tx} ${ty}`}else{const sy=dy>0?a.y+a.h:a.y,ty=dy>0?b.y:b.y,sx=x1,tx=x2;p=`M${sx} ${sy} C${sx} ${sy+(ty-sy)*.5},${tx} ${sy+(ty-sy)*.5},${tx} ${ty}`}return p}
function visible(n){return (filter==='all'||n.phase===filter||n.phase==='shared')&&(!search||[n.name,n.sub,n.desc,...n.inputs,...n.outputs].join(' ').toLowerCase().includes(search))}
function render(){world.replaceChildren();el('rect',{x:26,y:14,width:1506,height:480,rx:16,fill:'#102740',stroke:'#2a5679','stroke-width':1.7});el('rect',{x:26,y:511,width:1506,height:510,rx:16,fill:'#122a27',stroke:'#2a6d59','stroke-width':1.7});textNode(50,45,'01  SERVING · SHOW TO USERS','phase-title');textNode(50,67,'Realtime watchlists and API-based market data; no price-history replication needed for ordinary pages','phase-note');textNode(50,542,'02  DATA PIPELINE · COLLECT, TRAIN & STORE','phase-title');textNode(50,563,'Persist research datasets and forecasts; keep model training separate from live requests','phase-note');
for(const [a,b] of edges){const na=byId[a],nb=byId[b],connected=selected&&(a===selected||b===selected);const p=el('path',{d:path(na,nb),class:'edge'+(connected?' highlight':'')+((!visible(na)||!visible(nb))?' dim':'')});p.dataset.a=a;p.dataset.b=b}
for(const n of nodes){const g=el('g',{class:'node'+(n.id===selected?' selected':'')+(!visible(n)?' dim':''),transform:`translate(${n.x},${n.y})`,tabindex:0,role:'button','aria-label':`Inspect ${n.name}`});g.dataset.id=n.id;const [fill,stroke]=palette[n.type];el('rect',{width:n.w,height:n.h,rx:12,fill,stroke},g);el('rect',{x:12,y:12,width:5,height:n.h-24,rx:2,fill:stroke},g);textNode(27,32,n.name,'node-title',g);const chunks=n.sub.split(' · ');chunks.forEach((s,i)=>textNode(27,53+i*15,(chunks.length>2&&i===0?s+' ·':s),'node-sub',g));if(n.id==='train'){textNode(27,100,'Close · high · low · gain probability','node-sub',g)}g.addEventListener('click',()=>select(n.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id)}})}world.setAttribute('transform',`translate(${px} ${py}) scale(${zoom})`)}
function select(id){selected=id;render();details()}
function details(){const d=document.getElementById('detail');if(!selected){d.innerHTML=`<div class="eyebrow">Component inspector</div><h2>Explore the architecture</h2><p>Click a node to see its responsibility, data inputs and outputs, dependencies and design considerations.</p><h3>Key design rules</h3><div class="item">Live prices: only the shared watchlist stream during trading hours.</div><div class="item">Other stocks: on-demand Upstox REST queries via Lambda.</div><div class="item">S3: historical research and trained-model artifacts.</div><div class="item">Aurora: users, watchlists, predictions and outcomes.</div><div class="item">Redis / Athena: optional, not mandatory for an MVP.</div><div class="note" style="margin-top:22px">Tip: click a node to highlight the data paths connected to it. Use search to locate a service, zoom with the controls, or drag the diagram to pan.</div>`;return}const n=byId[selected],deps=edges.filter(e=>e.includes(selected)).map(e=>e[0]===selected?byId[e[1]]:byId[e[0]]);let html=`<div class="eyebrow">${n.phase==='serve'?'① Serving':n.phase==='pipeline'?'② Processing & ML':'Shared service'} · ${n.type}</div><h2>${n.name}</h2><p>${n.desc}</p><h3>Inputs</h3>${n.inputs.map(t=>`<div class="item">${t}</div>`).join('')}<h3>Outputs</h3>${n.outputs.map(t=>`<div class="item">${t}</div>`).join('')}<h3>Connected components</h3>${deps.map(t=>`<button class="go" data-id="${t.id}" style="margin:0 5px 6px 0">${t.name}</button>`).join('')}<h3>Implementation note</h3><div class="note">${n.notes}</div><div class="footer"><button id="clear">Clear selection</button></div>`;d.innerHTML=html;d.querySelectorAll('.go').forEach(e=>e.onclick=()=>select(e.dataset.id));d.querySelector('#clear').onclick=()=>select(null)}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('search').oninput=e=>{search=e.target.value.trim().toLowerCase();render()};function setZoom(v){zoom=Math.min(2.2,Math.max(.55,v));render()}document.getElementById('plus').onclick=()=>setZoom(zoom*1.18);document.getElementById('minus').onclick=()=>setZoom(zoom/1.18);document.getElementById('reset').onclick=()=>{zoom=1;px=0;py=0;render()};let drag=null;svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,px,py};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();px=drag.px+(e.clientX-drag.x)*1560/r.width;py=drag.py+(e.clientY-drag.y)*1040/r.height;render()});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);svg.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.08:.92))},{passive:false});render();details();
</script></body></html>
